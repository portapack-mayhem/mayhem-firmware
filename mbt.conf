# Example mbt config (copy to mbt.conf or .mbt.conf)

# Build directory (optional)
# BUILD_DIR="$PWD/build"

# Generator: ninja | make
MBT_GENERATOR="ninja"

# Enable ccache (0/1)
MBT_USE_CCACHE=1

# Extra CMake configure args.
# You can use either a string or an array:
# MBT_CMAKE_ARGS="-DCMAKE_BUILD_TYPE=Release -DPORTAPACK_VERSION=nightly"
# MBT_CMAKE_ARGS=(
#   "-DCMAKE_BUILD_TYPE=Release"
#   "-DPORTAPACK_VERSION=nightly"
# )
